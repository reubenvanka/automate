# Energy Monitoring Configuration for AutoMate
# ZMCT103C Current Sensor + ZMPT101B Voltage Sensor
# Includes RMS calculation, power factor, and energy accumulation

# Current Sensor: ZMCT103C (1000:1 turns ratio, 5mA @ 5A, max 10A)
# Conditioning circuit:
# - 150Ω burden resistor → 1.5V peak at 10A
# - 2x 10kΩ bias divider → 1.65V center
# - 10µF DC blocking capacitor
# - 100nF filter + 1kΩ series + 3.3V Zener clamp
# - ADC1_CH6 (GPIO34) with 11dB attenuation

# Voltage Sensor: ZMPT101B (0-5V output, 5V supply)
# Conditioning circuit:
# - 2x 10kΩ divider → 2:1 ratio (5V IN → 2.5V MAX OUT)
# - 100nF filter + 1kΩ series + 3.3V Zener clamp
# - ADC1_CH7 (GPIO35) with 11dB attenuation

# Raw ADC sensors for calibration and debugging
sensor:
  - platform: adc
    id: adc_raw_current
    name: "Raw Current ADC"
    pin: GPIO34
    update_interval: 1000ms
    # For debugging only - not used in production

  - platform: adc
    id: adc_raw_voltage
    name: "Raw Voltage ADC"
    pin: GPIO35
    update_interval: 1000ms
    # For debugging only - not used in production

