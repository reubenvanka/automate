# Power Calculation (P = V_rms * I_rms * Power Factor)
# For simplicity, assuming unity power factor (resistive load)
# More accurate implementation would measure phase difference
  - platform: template
    id: active_power
    name: "Active Power"
    unit_of_measurement: "W"
    accuracy_decimals: 1
    lambda: |-
      // Placeholder calculation
      // Real implementation would:
      // 1. Calculate RMS current and voltage
      // 2. Measure phase difference for power factor
      // 3. P = V_rms * I_rms * PF
      return (id(rms_voltage).state * id(rms_current).state);  // Assumes PF=1.0

# Energy Accumulation (kWh = ∫P dt / 3.6e6)
  - platform: total_daily_energy
    id: daily_energy
    name: "Daily Energy"
    power_id: active_power
    unit_of_measurement: "kWh"
    accuracy_decimals: 3

