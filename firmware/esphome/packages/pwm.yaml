output:
  - platform: ledc
    id: output_ceiling_warm
    pin: GPIO18
    frequency: 10000Hz

  - platform: ledc
    id: output_ceiling_cold
    pin: GPIO19
    frequency: 10000Hz

  - platform: ledc
    id: output_desk1_warm
    pin: GPIO25
    frequency: 10000Hz

  - platform: ledc
    id: output_desk1_cold
    pin: GPIO26
    frequency: 10000Hz

  - platform: ledc
    id: output_desk2_warm
    pin: GPIO4
    frequency: 10000Hz

  - platform: ledc
    id: output_desk2_cold
    pin: GPIO5
    frequency: 10000Hz

  - platform: ledc
    id: output_photo_spot_light
    pin: GPIO12
    frequency: 10000Hz

  - platform: ledc
    id: output_wall_bounce_light
    pin: GPIO13
    frequency: 10000Hz

  - platform: ledc
    id: output_terrace_light
    pin: GPIO27
    frequency: 10000Hz

  - platform: ledc
    id: output_washroom_light
    pin: GPIO33
    frequency: 10000Hz

light:
  - platform: cwww
    id: light_ceiling
    name: "Ceiling Light"
    restore_mode: RESTORE_DEFAULT_OFF
    cold_white: output_ceiling_cold
    warm_white: output_ceiling_warm
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2500 K
    on_turn_on:
      then:
        - switch.turn_on: relay_ceiling_driver
        - script.execute: blink_led
    on_turn_off:
      then:
        - switch.turn_off: relay_ceiling_driver
        - script.execute: blink_led
    on_state:
      then:
        - lambda: |-
            auto state = id(light_ceiling).current_values;
            id(ceiling_prev_state) = state.is_on();
            id(ceiling_prev_brightness) = state.get_brightness();
            id(ceiling_prev_color_temp) = state.get_color_temperature();
            ESP_LOGD("light", "Ceiling state saved: On - %s, Brightness - %.0f%%, Temperature - %d K", id(ceiling_prev_state) ? "Yes" : "No", id(ceiling_prev_brightness) * 100, (int)(1000000.0 / id(ceiling_prev_color_temp)));

  - platform: cwww
    id: light_desk1
    name: "Desk 1 Light"
    restore_mode: RESTORE_DEFAULT_OFF
    cold_white: output_desk1_cold
