# Relay Configuration for AutoMate
# 74HC595 shift register (8 relays) + 1 direct 30A relay
# All relays are ACTIVE-LOW (input LOW = ON, input HIGH = OFF)

# =============================================================================
# GLOBAL STATE VARIABLES - One per relay, ALL persist with restore_value: yes
# =============================================================================
globals:
  - id: fan_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ceiling_driver_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: driver12v_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: stabilizer_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: desk1_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: desk2_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: desk3_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: relay_16a_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: relay_30a_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: non_ceiling_active_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: desks_active_count
    type: int
    restore_value: no
    initial_value: '0'

sn74hc595:
  - id: sr_relays
    data_pin: GPIO0
    clock_pin: GPIO23
    latch_pin: GPIO15
    sr_count: 1

# =============================================================================
# INTERNAL RELAYS (via 74HC595) - Native GPIO with state persistence
# =============================================================================
switch:
  - platform: gpio
    id: relay_fan
    name: "Fan Relay"
    pin: { sn74hc595: sr_relays, number: 0, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(fan_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(fan_state) = false;'

  - platform: gpio
    id: relay_ceiling_driver
    name: "Ceiling Driver Relay"
    pin: { sn74hc595: sr_relays, number: 1, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(ceiling_driver_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(ceiling_driver_state) = false;'

  - platform: gpio
    id: relay_12v_driver
    name: "12V Driver Relay"
    pin: { sn74hc595: sr_relays, number: 2, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(driver12v_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(driver12v_state) = false;'

  - platform: gpio
    id: relay_stabilizer
    name: "Voltage Stabilizer Relay"
    pin: { sn74hc595: sr_relays, number: 3, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(stabilizer_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(stabilizer_state) = false;'

  - platform: gpio
    id: relay_desk1
    name: "Desk 1 Relay"
    pin: { sn74hc595: sr_relays, number: 4, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(desk1_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(desk1_state) = false;'

  - platform: gpio
    id: relay_desk2
    name: "Desk 2 Relay"
    pin: { sn74hc595: sr_relays, number: 5, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(desk2_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(desk2_state) = false;'

  - platform: gpio
    id: relay_desk3
    name: "Desk 3 Relay"
    pin: { sn74hc595: sr_relays, number: 6, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(desk3_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(desk3_state) = false;'

  - platform: gpio
    id: relay_16a
    name: "16A Relay"
    pin: { sn74hc595: sr_relays, number: 7, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(relay_16a_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(relay_16a_state) = false;'

  # Direct 30A relay on GPIO32
  - platform: gpio
    id: relay_30a
    name: "30A Relay"
    pin:
      number: GPIO32
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(relay_30a_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(relay_30a_state) = false;'

# =============================================================================
# EXPOSED SWITCHES FOR HOME ASSISTANT - Template switches mirroring relays
# =============================================================================
  - platform: template
    id: switch_fan
    name: "Fan"
    icon: "mdi:fan"
    optimistic: false
    lambda: 'return id(relay_fan).state;'
    turn_on_action:
      - switch.turn_on: relay_fan
    turn_off_action:
      - switch.turn_off: relay_fan

  - platform: template
    id: switch_ceiling_driver
    name: "Ceiling Driver"
    icon: "mdi:ceiling-light"
    optimistic: false
    lambda: 'return id(relay_ceiling_driver).state;'
    turn_on_action:
      - switch.turn_on: relay_ceiling_driver
    turn_off_action:
      - switch.turn_off: relay_ceiling_driver

  - platform: template
    id: switch_12v_driver
    name: "12V Driver"
    icon: "mdi:power-plug"
    optimistic: false
    lambda: 'return id(relay_12v_driver).state;'
    turn_on_action:
      - switch.turn_on: relay_12v_driver
    turn_off_action:
      - switch.turn_off: relay_12v_driver

  - platform: template
    id: switch_stabilizer
    name: "Voltage Stabilizer"
    icon: "mdi:flash"
    optimistic: false
    lambda: 'return id(relay_stabilizer).state;'
    turn_on_action:
      - switch.turn_on: relay_stabilizer
    turn_off_action:
      - switch.turn_off: relay_stabilizer

  - platform: template
    id: switch_desk1
    name: "Desk 1"
    icon: "mdi:desk"
    optimistic: false
    lambda: 'return id(relay_desk1).state;'
    turn_on_action:
      - switch.turn_on: relay_desk1
      - script.execute: increment_desk_users
    turn_off_action:
      - switch.turn_off: relay_desk1
      - script.execute: decrement_desk_users

  - platform: template
    id: switch_desk2
    name: "Desk 2"
    icon: "mdi:desk"
    optimistic: false
    lambda: 'return id(relay_desk2).state;'
    turn_on_action:
      - switch.turn_on: relay_desk2
      - script.execute: increment_desk_users
    turn_off_action:
      - switch.turn_off: relay_desk2
      - script.execute: decrement_desk_users

  - platform: template
    id: switch_desk3
    name: "Desk 3"
    icon: "mdi:desk"
    optimistic: false
    lambda: 'return id(relay_desk3).state;'
    turn_on_action:
      - switch.turn_on: relay_desk3
      - script.execute: increment_desk_users
    turn_off_action:
      - switch.turn_off: relay_desk3
      - script.execute: decrement_desk_users

  - platform: template
    id: switch_16a
    name: "16A Relay"
    icon: "mdi:power-socket"
    optimistic: false
    lambda: 'return id(relay_16a).state;'
    turn_on_action:
      - switch.turn_on: relay_16a
    turn_off_action:
      - switch.turn_off: relay_16a

  - platform: template
    id: switch_30a
    name: "30A Relay"
    icon: "mdi:power-socket"
    optimistic: false
    lambda: 'return id(relay_30a).state;'
    turn_on_action:
      - switch.turn_on: relay_30a
    turn_off_action:
      - switch.turn_off: relay_30a

# =============================================================================
# EXPOSED SWITCHES FOR HOME ASSISTANT - Template switches mirroring relays
# =============================================================================
# DEPENDENT AUTOMATIONS - Controlled ONLY by explicit user actions
# =============================================================================
# 12V Driver: ON when ANY non-ceiling light ON (ALL PWM except ceiling: PCA9685 CH0-15 + GPIO LEDC non-ceiling), OFF when all OFF
# Ceiling Driver: Follows ceiling light
# Voltage Stabilizer: ON when any desk relay (desk1/2/3) ON, OFF when all OFF

# Helper scripts for 12V driver (powers ALL non-ceiling PWM: PCA9685 CH0-15 + GPIO LEDC except ceiling CCT)
script:
  - id: increment_12v_users
    then:
      - lambda: |-
          id(non_ceiling_active_count)++;
          if (id(non_ceiling_active_count) == 1) {
            id(relay_12v_driver).turn_on();
            id(switch_12v_driver).publish_state(true);
            id(driver12v_state) = true;
            ESP_LOGD("12v_driver", "12V Driver ON (users: %d)", id(non_ceiling_active_count));
          }
  - id: decrement_12v_users
    then:
      - lambda: |-
          if (id(non_ceiling_active_count) > 0) {
            id(non_ceiling_active_count)--;
          }
          if (id(non_ceiling_active_count) == 0) {
            id(relay_12v_driver).turn_off();
            id(switch_12v_driver).publish_state(false);
            id(driver12v_state) = false;
            ESP_LOGD("12v_driver", "12V Driver OFF (users: %d)", id(non_ceiling_active_count));
          }

# Helper scripts for Stabilizer (controlled by desk relays desk1/2/3)
  - id: increment_desk_users
    then:
      - lambda: |-
          id(desks_active_count)++;
          if (id(desks_active_count) == 1) {
            id(relay_stabilizer).turn_on();
            id(switch_stabilizer).publish_state(true);
            id(stabilizer_state) = true;
            ESP_LOGD("stabilizer", "Stabilizer ON (desks: %d)", id(desks_active_count));
          }
  - id: decrement_desk_users
    then:
      - lambda: |-
          if (id(desks_active_count) > 0) {
            id(desks_active_count)--;
          }
          if (id(desks_active_count) == 0) {
            id(relay_stabilizer).turn_off();
            id(switch_stabilizer).publish_state(false);
            id(stabilizer_state) = false;
            ESP_LOGD("stabilizer", "Stabilizer OFF (desks: %d)", id(desks_active_count));
          }

# Ceiling Driver follows ceiling light directly (handled in light on_turn_on/off)
# Stabilizer controlled by desk relays (handled in desk template switch turn_on/off)

# Debug: Periodic relay state logging
interval:
  - interval: 30s
    then:
      - lambda: |-
          ESP_LOGD("relay_state", "=== Relay States ===");
          ESP_LOGD("relay_state", "relay_fan: %d", id(relay_fan).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_ceiling_driver: %d", id(relay_ceiling_driver).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_12v_driver: %d", id(relay_12v_driver).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_stabilizer: %d", id(relay_stabilizer).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_desk1: %d", id(relay_desk1).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_desk2: %d", id(relay_desk2).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_desk3: %d", id(relay_desk3).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_16a: %d", id(relay_16a).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_30a: %d", id(relay_30a).state ? 1 : 0);
          ESP_LOGD("relay_state", "12V users: %d, Desk users: %d", id(non_ceiling_active_count), id(desks_active_count));
