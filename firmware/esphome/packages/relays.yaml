# Relay Configuration for AutoMate
# 74HC595 shift register (8 relays) + 1 direct 30A relay
# All relays are ACTIVE-LOW (input LOW = ON, input HIGH = OFF)

# =============================================================================
# GLOBAL STATE VARIABLES - One per relay, ALL persist with restore_value: yes
# =============================================================================
globals:
  - id: fan_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ceiling_driver_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: driver12v_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: stabilizer_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: desk1_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: desk2_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: desk3_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: relay_16a_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: relay_30a_state
    type: bool
    restore_value: yes
    initial_value: 'false'

sn74hc595:
  - id: sr_relays
    data_pin: GPIO0
    clock_pin: GPIO23
    latch_pin: GPIO15
    sr_count: 1

# =============================================================================
# INTERNAL RELAYS (via 74HC595) - Native GPIO with state persistence
# =============================================================================
switch:
  - platform: gpio
    id: relay_fan
    name: "Fan Relay"
    pin: { sn74hc595: sr_relays, number: 0, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(fan_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(fan_state) = false;'

  - platform: gpio
    id: relay_ceiling_driver
    name: "Ceiling Driver Relay"
    pin: { sn74hc595: sr_relays, number: 1, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(ceiling_driver_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(ceiling_driver_state) = false;'

  - platform: gpio
    id: relay_12v_driver
    name: "12V Driver Relay"
    pin: { sn74hc595: sr_relays, number: 2, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(driver12v_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(driver12v_state) = false;'

  - platform: gpio
    id: relay_stabilizer
    name: "Voltage Stabilizer Relay"
    pin: { sn74hc595: sr_relays, number: 3, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(stabilizer_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(stabilizer_state) = false;'

  - platform: gpio
    id: relay_desk1
    name: "Desk 1 Relay"
    pin: { sn74hc595: sr_relays, number: 4, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(desk1_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(desk1_state) = false;'

  - platform: gpio
    id: relay_desk2
    name: "Desk 2 Relay"
    pin: { sn74hc595: sr_relays, number: 5, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(desk2_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(desk2_state) = false;'

  - platform: gpio
    id: relay_desk3
    name: "Desk 3 Relay"
    pin: { sn74hc595: sr_relays, number: 6, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(desk3_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(desk3_state) = false;'

  - platform: gpio
    id: relay_16a
    name: "16A Relay"
    pin: { sn74hc595: sr_relays, number: 7, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(relay_16a_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(relay_16a_state) = false;'

  # Direct 30A relay on GPIO32
  - platform: gpio
    id: relay_30a
    name: "30A Relay"
    pin:
      number: GPIO32
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'id(relay_30a_state) = true;'
    on_turn_off:
      then:
        - lambda: 'id(relay_30a_state) = false;'

# =============================================================================
# EXPOSED SWITCHES FOR HOME ASSISTANT - Template switches mirroring relays
# =============================================================================
  - platform: template
    id: switch_fan
    name: "Fan"
    icon: "mdi:fan"
    optimistic: false
    lambda: 'return id(relay_fan).state;'
    turn_on_action:
      - switch.turn_on: relay_fan
    turn_off_action:
      - switch.turn_off: relay_fan

  - platform: template
    id: switch_ceiling_driver
    name: "Ceiling Driver"
    icon: "mdi:ceiling-light"
    optimistic: false
    lambda: 'return id(relay_ceiling_driver).state;'
    turn_on_action:
