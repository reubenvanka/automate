    turn_off_action:
      - switch.turn_off: relay_30a

# =============================================================================
# DEPENDENT RELAY AUTOMATIONS
# Controlled ONLY by explicit user actions (lights/switches), not binary sensors
# =============================================================================
# 12V Driver: ON when any non-ceiling light turns ON, OFF when all turn OFF
# Ceiling Driver: Follows ceiling light state  
# Voltage Stabilizer: ON when any desk switch ON, OFF when all OFF

# We use a simple counter approach for 12V driver to track how many lights need it
# (defined in the main globals section at top)
# Helper scripts for 12V driver management
script:
  - id: increment_12v_users
    then:
      - lambda: |-
          id(lights_using_12v_count)++;
          if (id(lights_using_12v_count) == 1) {
            id(relay_12v_driver).turn_on();
            id(switch_12v_driver).publish_state(true);
            id(driver12v_prev_state) = true;
            ESP_LOGD("12v_driver", "12V Driver ON (users: %d)", id(lights_using_12v_count));
          }
  - id: decrement_12v_users
    then:
      - lambda: |-
          if (id(lights_using_12v_count) > 0) {
            id(lights_using_12v_count)--;
          }
          if (id(lights_using_12v_count) == 0) {
            id(relay_12v_driver).turn_off();
            id(switch_12v_driver).publish_state(false);
            id(driver12v_prev_state) = false;
            ESP_LOGD("12v_driver", "12V Driver OFF (users: %d)", id(lights_using_12v_count));
          }

# Debug: Periodic relay state logging
interval:
  - interval: 30s
    then:
      - lambda: |-
          ESP_LOGD("relay_state", "=== Relay States ===");
          ESP_LOGD("relay_state", "relay_fan: %d", id(relay_fan).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_ceiling_driver: %d", id(relay_ceiling_driver).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_12v_driver: %d", id(relay_12v_driver).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_stabilizer: %d", id(relay_stabilizer).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_desk1: %d", id(relay_desk1).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_desk2: %d", id(relay_desk2).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_desk3: %d", id(relay_desk3).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_16a: %d", id(relay_16a).state ? 1 : 0);
          ESP_LOGD("relay_state", "relay_30a: %d", id(relay_30a).state ? 1 : 0);
          ESP_LOGD("relay_state", "12V users count: %d", id(lights_using_12v_count));
