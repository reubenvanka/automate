  - platform: template
    id: switch_desk1
    name: "Desk 1"
    icon: "mdi:desk"
    optimistic: false
    lambda: 'return id(relay_desk1).state;'
    turn_on_action:
      - switch.turn_on: relay_desk1
    turn_off_action:
      - switch.turn_off: relay_desk1

  - platform: template
    id: switch_desk2
    name: "Desk 2"
    icon: "mdi:desk"
    optimistic: false
    lambda: 'return id(relay_desk2).state;'
    turn_on_action:
      - switch.turn_on: relay_desk2
    turn_off_action:
      - switch.turn_off: relay_desk2

  - platform: template
    id: switch_desk3
    name: "Desk 3"
    icon: "mdi:desk"
    optimistic: false
    lambda: 'return id(relay_desk3).state;'
    turn_on_action:
      - switch.turn_on: relay_desk3
    turn_off_action:
      - switch.turn_off: relay_desk3

  - platform: template
    id: switch_16a
    name: "16A Relay"
    icon: "mdi:power-socket"
    optimistic: false
    lambda: 'return id(relay_16a).state;'
    turn_on_action:
      - switch.turn_on: relay_16a
    turn_off_action:
