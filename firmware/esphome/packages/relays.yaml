# ============================================================================
# DEPENDENT RELAY AUTOMATIONS (per SPECIFICATIONS.md)
# ============================================================================
# AM-RLY-03 (12V Driver): ON when any non-ceiling PWM active, OFF when all inactive
# AM-RLY-02 (Ceiling Driver): Follow ceiling PWM state; OFF when both ceiling PWM off
# AM-RLY-04 (Voltage Stabilizer): ON when any desk ON, OFF only when all desks OFF

binary_sensor:
  - platform: template
    id: non_ceiling_pwm_active
    name: "Non-Ceiling PWM Active"
    lambda: |-
      return (
        id(light_desk1).current_values.is_on() || id(light_desk2).current_values.is_on() ||
        id(light_photo_spot).current_values.is_on() || id(light_wall_bounce).current_values.is_on() ||
        id(light_terrace).current_values.is_on() || id(light_washroom).current_values.is_on() ||
        id(light_monitor1_backlight).current_values.is_on() || id(light_monitor2_backlight).current_values.is_on() ||
        id(light_monitor3_backlight).current_values.is_on() || id(light_monitor4_backlight).current_values.is_on() ||
        id(light_desk_light1).current_values.is_on() || id(light_desk_light2).current_values.is_on() ||
        id(light_table_light).current_values.is_on() || id(light_shelf_light1).current_values.is_on() ||
        id(light_shelf_light2).current_values.is_on() || id(light_cupboard_bounce).current_values.is_on() ||
        id(light_cupboard_spot).current_values.is_on() || id(light_door_spot).current_values.is_on() ||
        id(light_exhaust_fans).current_values.is_on() || id(light_terrace_ambient).current_values.is_on()
      );
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - switch.turn_on: relay_12v_driver
            else:
              - switch.turn_off: relay_12v_driver

  - platform: template
    id: ceiling_pwm_active
    name: "Ceiling PWM Active"
    lambda: |-
      return id(light_ceiling).current_values.is_on();
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - switch.turn_on: relay_ceiling_driver
            else:
              - switch.turn_off: relay_ceiling_driver

  - platform: template
    id: desks_active
    name: "Any Desk Active"
    lambda: |-
      return (id(switch_desk1).state || id(switch_desk2).state || id(switch_desk3).state);
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - switch.turn_on: relay_stabilizer
            else:
              - switch.turn_off: relay_stabilizer

# Debug: Periodic relay state logging
interval:
  - interval: 30s
    then:
      - lambda: |-
          ESP_LOGD("relay_state", "=== Relay States ===");
          ESP_LOGD("relay_state", "relay_fan: %d", id(relay_fan) ? 1 : 0);
          ESP_LOGD("relay_state", "relay_ceiling_driver: %d", id(relay_ceiling_driver) ? 1 : 0);
          ESP_LOGD("relay_state", "relay_12v_driver: %d", id(relay_12v_driver) ? 1 : 0);
          ESP_LOGD("relay_state", "relay_stabilizer: %d", id(relay_stabilizer) ? 1 : 0);
          ESP_LOGD("relay_state", "relay_desk1: %d", id(relay_desk1) ? 1 : 0);
          ESP_LOGD("relay_state", "relay_desk2: %d", id(relay_desk2) ? 1 : 0);
          ESP_LOGD("relay_state", "relay_desk3: %d", id(relay_desk3) ? 1 : 0);
          ESP_LOGD("relay_state", "relay_16a: %d", id(relay_16a) ? 1 : 0);
          ESP_LOGD("relay_state", "relay_30a: %d", id(relay_30a) ? 1 : 0);
