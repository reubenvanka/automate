# Relay Configuration for AutoMate
# 74HC595 shift register (8 relays) + 1 direct 30A relay
# All relays are ACTIVE-LOW (input LOW = ON, input HIGH = OFF)
# relay-test.yaml had inverted: true and worked - use same config

# Global variables for state persistence (restored on boot)
globals:
  - id: fan_prev_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ceiling_driver_prev_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: driver12v_prev_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: stabilizer_prev_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: desk3_prev_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: relay_16a_prev_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: relay_30a_prev_state
    type: bool
    restore_value: no
    initial_value: 'false'

sn74hc595:
  - id: sr_relays
    data_pin: GPIO0
    clock_pin: GPIO23
    latch_pin: GPIO15
    sr_count: 1

# 8 relays via 74HC595 - inverted: true (matches relay-test.yaml that worked)
# Using switch.gpio platform for native state synchronization with HA/dashboard
switch:
  # GPIO relays via 74HC595 - internal (not exposed to HA)
  - platform: gpio
    id: relay_fan
    name: "Fan Relay"
    pin: { sn74hc595: sr_relays, number: 0, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'if (!id(relay_fan).state) { id(switch_fan).publish_state(true); id(fan_prev_state) = true; }'
    on_turn_off:
      then:
        - lambda: 'if (id(relay_fan).state) { id(switch_fan).publish_state(false); id(fan_prev_state) = false; }'

  - platform: gpio
    id: relay_ceiling_driver
    name: "Ceiling Driver Relay"
    pin: { sn74hc595: sr_relays, number: 1, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'if (!id(relay_ceiling_driver).state) { id(switch_ceiling_driver).publish_state(true); id(ceiling_driver_prev_state) = true; }'
    on_turn_off:
      then:
        - lambda: 'if (id(relay_ceiling_driver).state) { id(switch_ceiling_driver).publish_state(false); id(ceiling_driver_prev_state) = false; }'

  - platform: gpio
    id: relay_12v_driver
    name: "12V Driver Relay"
    pin: { sn74hc595: sr_relays, number: 2, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'if (!id(relay_12v_driver).state) { id(switch_12v_driver).publish_state(true); id(driver12v_prev_state) = true; }'
    on_turn_off:
      then:
        - lambda: 'if (id(relay_12v_driver).state) { id(switch_12v_driver).publish_state(false); id(driver12v_prev_state) = false; }'

  - platform: gpio
    id: relay_stabilizer
    name: "Voltage Stabilizer Relay"
    pin: { sn74hc595: sr_relays, number: 3, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'if (!id(relay_stabilizer).state) { id(switch_stabilizer).publish_state(true); id(stabilizer_prev_state) = true; }'
    on_turn_off:
      then:
        - lambda: 'if (id(relay_stabilizer).state) { id(switch_stabilizer).publish_state(false); id(stabilizer_prev_state) = false; }'

  - platform: gpio
    id: relay_desk1
    name: "Desk 1 Relay"
    pin: { sn74hc595: sr_relays, number: 4, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'if (!id(relay_desk1).state) { id(switch_desk1).publish_state(true); id(desk1_prev_state) = true; }'
    on_turn_off:
      then:
        - lambda: 'if (id(relay_desk1).state) { id(switch_desk1).publish_state(false); id(desk1_prev_state) = false; }'

  - platform: gpio
    id: relay_desk2
    name: "Desk 2 Relay"
    pin: { sn74hc595: sr_relays, number: 5, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'if (!id(relay_desk2).state) { id(switch_desk2).publish_state(true); id(desk2_prev_state) = true; }'
    on_turn_off:
      then:
        - lambda: 'if (id(relay_desk2).state) { id(switch_desk2).publish_state(false); id(desk2_prev_state) = false; }'

  - platform: gpio
    id: relay_desk3
    name: "Desk 3 Relay"
    pin: { sn74hc595: sr_relays, number: 6, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'if (!id(relay_desk3).state) { id(switch_desk3).publish_state(true); id(desk3_prev_state) = true; }'
    on_turn_off:
      then:
        - lambda: 'if (id(relay_desk3).state) { id(switch_desk3).publish_state(false); id(desk3_prev_state) = false; }'

  - platform: gpio
    id: relay_16a
    name: "16A Relay"
    pin: { sn74hc595: sr_relays, number: 7, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'if (!id(relay_16a).state) { id(switch_16a).publish_state(true); id(relay_16a_prev_state) = true; }'
    on_turn_off:
      then:
        - lambda: 'if (id(relay_16a).state) { id(switch_16a).publish_state(false); id(relay_16a_prev_state) = false; }'

# Direct 30A relay (active-LOW, direct ESP32 GPIO) - internal (not exposed to HA)
  - platform: gpio
    id: relay_30a
    name: "30A Main Relay"
    pin:
      number: GPIO32
      inverted: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true
    on_turn_on:
      then:
        - lambda: 'if (!id(relay_30a).state) { id(switch_30a).publish_state(true); id(relay_30a_prev_state) = true; }'
    on_turn_off:
      then:
        - lambda: 'if (id(relay_30a).state) { id(switch_30a).publish_state(false); id(relay_30a_prev_state) = false; }'

  # Template switches with proper state sync - read from switch.gpio relays
  - platform: template
    id: switch_fan
    name: "Fan Switch"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(relay_fan).state;
    turn_on_action:
      then:
        - switch.turn_on: relay_fan
    turn_off_action:
      then:
        - switch.turn_off: relay_fan

  - platform: template
    id: switch_ceiling_driver
    name: "Ceiling Driver Switch"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(relay_ceiling_driver).state;
    turn_on_action:
      then:
        - switch.turn_on: relay_ceiling_driver
    turn_off_action:
      then:
        - switch.turn_off: relay_ceiling_driver

  - platform: template
    id: switch_12v_driver
    name: "12V Driver Switch"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(relay_12v_driver).state;
    turn_on_action:
      then:
        - switch.turn_on: relay_12v_driver
    turn_off_action:
      then:
        - switch.turn_off: relay_12v_driver

  - platform: template
    id: switch_stabilizer
    name: "Stabilizer Switch"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(relay_stabilizer).state;
    turn_on_action:
      then:
        - switch.turn_on: relay_stabilizer
    turn_off_action:
      then:
        - switch.turn_off: relay_stabilizer

  - platform: template
    id: switch_desk1
    name: "Desk 1 Switch"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(relay_desk1).state;
    turn_on_action:
      then:
        - switch.turn_on: relay_desk1
    turn_off_action:
      then:
        - switch.turn_off: relay_desk1

  - platform: template
    id: switch_desk2
    name: "Desk 2 Switch"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(relay_desk2).state;
    turn_on_action:
      then:
        - switch.turn_on: relay_desk2
    turn_off_action:
      then:
        - switch.turn_off: relay_desk2

  - platform: template
    id: switch_desk3
    name: "Desk 3 Switch"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(relay_desk3).state;
    turn_on_action:
      then:
        - switch.turn_on: relay_desk3
    turn_off_action:
      then:
        - switch.turn_off: relay_desk3

  - platform: template
    id: switch_16a
    name: "16A Switch"
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(relay_16a).state;
    turn_on_action:
      then:
