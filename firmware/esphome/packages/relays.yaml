# Relay Configuration for AutoMate
# 74HC595 shift register (8 relays) + 1 direct 30A relay
# All relays are ACTIVE-LOW (input LOW = ON, input HIGH = OFF)
# relay-test.yaml had inverted: true and worked - use same config

# =============================================================================
# GLOBAL STATE VARIABLES - All persist across restarts with restore_value: yes
# =============================================================================
globals:
  - id: fan_prev_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: ceiling_driver_prev_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: driver12v_prev_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: stabilizer_prev_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: desk3_prev_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: relay_16a_prev_state
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: relay_30a_prev_state
    type: bool
    restore_value: yes
    initial_value: 'false'

# Global flag to prevent automations during boot
  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'

# Counter for 12V driver users
  - id: lights_using_12v_count
    type: int
    restore_value: no
    initial_value: '0'

sn74hc595:
  - id: sr_relays
    data_pin: GPIO0
    clock_pin: GPIO23
    latch_pin: GPIO15
    sr_count: 1

# =============================================================================
# INTERNAL RELAYS (via 74HC595) - Not exposed to HA directly
# =============================================================================
switch:
  - platform: gpio
    id: relay_fan
    name: "Fan Relay"
    pin: { sn74hc595: sr_relays, number: 0, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: gpio
    id: relay_ceiling_driver
    name: "Ceiling Driver Relay"
    pin: { sn74hc595: sr_relays, number: 1, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: gpio
    id: relay_12v_driver
    name: "12V Driver Relay"
    pin: { sn74hc595: sr_relays, number: 2, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: gpio
    id: relay_stabilizer
    name: "Voltage Stabilizer Relay"
    pin: { sn74hc595: sr_relays, number: 3, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: gpio
    id: relay_desk1
    name: "Desk 1 Relay"
    pin: { sn74hc595: sr_relays, number: 4, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: gpio
    id: relay_desk2
    name: "Desk 2 Relay"
    pin: { sn74hc595: sr_relays, number: 5, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: gpio
    id: relay_desk3
    name: "Desk 3 Relay"
    pin: { sn74hc595: sr_relays, number: 6, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: gpio
    id: relay_16a
    name: "16A Relay"
    pin: { sn74hc595: sr_relays, number: 7, inverted: true }
    restore_mode: ALWAYS_OFF
    internal: true

  # Direct 30A relay on GPIO32
  - platform: gpio
    id: relay_30a
    name: "30A Relay"
    pin:
      number: GPIO32
      inverted: true
    restore_mode: ALWAYS_OFF
    internal: true

# =============================================================================
# EXPOSED SWITCHES FOR HOME ASSISTANT
# These are what users control - they drive the internal relays
# =============================================================================
  - platform: template
    id: switch_fan
    name: "Fan"
    icon: "mdi:fan"
    optimistic: false
    lambda: |-
      return id(relay_fan).state;
    turn_on_action:
      - switch.turn_on: relay_fan
    turn_off_action:
      - switch.turn_off: relay_fan

  - platform: template
    id: switch_ceiling_driver
    name: "Ceiling Driver"
    icon: "mdi:ceiling-light"
    optimistic: false
    lambda: |-
      return id(relay_ceiling_driver).state;
    turn_on_action:
      - switch.turn_on: relay_ceiling_driver
    turn_off_action:
      - switch.turn_off: relay_ceiling_driver

  - platform: template
    id: switch_12v_driver
    name: "12V Driver"
    icon: "mdi:power-plug"
    optimistic: false
    lambda: |-
      return id(relay_12v_driver).state;
    turn_on_action:
      - switch.turn_on: relay_12v_driver
    turn_off_action:
      - switch.turn_off: relay_12v_driver

  - platform: template
    id: switch_stabilizer
    name: "Voltage Stabilizer"
    icon: "mdi:flash"
    optimistic: false
    lambda: |-
      return id(relay_stabilizer).state;
    turn_on_action:
      - switch.turn_on: relay_stabilizer
    turn_off_action:
      - switch.turn_off: relay_stabilizer

  - platform: template
    id: switch_desk1
    name: "Desk 1"
    icon: "mdi:desk"
    optimistic: false
    lambda: |-
      return id(relay_desk1).state;
    turn_on_action:
      - switch.turn_on: relay_desk1
    turn_off_action:
      - switch.turn_off: relay_desk1

  - platform: template
    id: switch_desk2
    name: "Desk 2"
    icon: "mdi:desk"
    optimistic: false
    lambda: |-
      return id(relay_desk2).state;
    turn_on_action:
      - switch.turn_on: relay_desk2
    turn_off_action:
      - switch.turn_off: relay_desk2

  - platform: template
    id: switch_desk3
    name: "Desk 3"
    icon: "mdi:desk"
    optimistic: false
    lambda: |-
      return id(relay_desk3).state;
    turn_on_action:
      - switch.turn_on: relay_desk3
    turn_off_action:
